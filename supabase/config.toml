project_id = "venfour"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/callback/case-claim/*",
  "http://localhost:5173/auth/callback/preview/*/*",
  "http://localhost:5173/auth/callback/preview-ready/*/*",
  "http://localhost:5173/total-loss/cases/*/claim/checkout",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback/case-claim/*",
  "http://127.0.0.1:5173/auth/callback/preview/*/*",
  "http://127.0.0.1:5173/auth/callback/preview-ready/*/*",
  "http://127.0.0.1:5173/total-loss/cases/*/claim/checkout",
  "https://staging.venfour.com/auth/callback",
  "https://staging.venfour.com/auth/callback/case-claim/*",
  "https://staging.venfour.com/auth/callback/preview/*/*",
  "https://staging.venfour.com/auth/callback/preview-ready/*/*",
  "https://venfour.com/auth/callback",
  "https://venfour.com/auth/callback/case-claim/*",
  "https://venfour.com/auth/callback/preview/*/*",
  "https://venfour.com/auth/callback/preview-ready/*/*",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.rate_limit]
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = '{{ $c := print .SiteURL "/total-loss/cases/" }}{{ $l := "http://127.0.0.1:5173/total-loss/cases/" }}{{ $p := print .SiteURL "/auth/callback/preview-ready/" }}{{ if or (and (ge (len .RedirectTo) (len $c)) (eq (slice .RedirectTo 0 (len $c)) $c)) (and (eq .SiteURL "http://localhost:5173") (ge (len .RedirectTo) (len $l)) (eq (slice .RedirectTo 0 (len $l)) $l)) }}Your Venfour verification code{{ else if and (ge (len .RedirectTo) (len $p)) (eq (slice .RedirectTo 0 (len $p)) $p) }}Your Venfour valuation preview is ready{{ else }}Continue your Venfour appraisal{{ end }}'
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = '{{ $c := print .SiteURL "/total-loss/cases/" }}{{ $l := "http://127.0.0.1:5173/total-loss/cases/" }}{{ $p := print .SiteURL "/auth/callback/preview-ready/" }}{{ if or (and (ge (len .RedirectTo) (len $c)) (eq (slice .RedirectTo 0 (len $c)) $c)) (and (eq .SiteURL "http://localhost:5173") (ge (len .RedirectTo) (len $l)) (eq (slice .RedirectTo 0 (len $l)) $l)) }}Your Venfour verification code{{ else if and (ge (len .RedirectTo) (len $p)) (eq (slice .RedirectTo 0 (len $p)) $p) }}Your Venfour valuation preview is ready{{ else }}Continue your Venfour appraisal{{ end }}'
content_path = "./supabase/templates/magic-link.html"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.cleanup-abandoned-anonymous-guests]
verify_jwt = false
