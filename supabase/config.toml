project_id = "venfour"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/callback/case-claim/*",
  "http://localhost:5173/auth/callback/preview/*/*",
  "http://localhost:5173/auth/callback/preview-ready/*/*",
  "http://localhost:5173/total-loss/cases/*/claim/checkout",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback/case-claim/*",
  "http://127.0.0.1:5173/auth/callback/preview/*/*",
  "http://127.0.0.1:5173/auth/callback/preview-ready/*/*",
  "http://127.0.0.1:5173/total-loss/cases/*/claim/checkout",
  "https://staging.venfour.com/auth/callback",
  "https://staging.venfour.com/auth/callback/case-claim/*",
  "https://staging.venfour.com/auth/callback/preview/*/*",
  "https://staging.venfour.com/auth/callback/preview-ready/*/*",
  "https://venfour.com/auth/callback",
  "https://venfour.com/auth/callback/case-claim/*",
  "https://venfour.com/auth/callback/preview/*/*",
  "https://venfour.com/auth/callback/preview-ready/*/*",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.rate_limit]
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "{{ $claimPrefix := print .SiteURL \"/total-loss/cases/\" }}{{ $localClaimPrefix := \"http://127.0.0.1:5173/total-loss/cases/\" }}{{ $claimCode := or (and (ge (len .RedirectTo) (len $claimPrefix)) (eq (slice .RedirectTo 0 (len $claimPrefix)) $claimPrefix)) (and (eq .SiteURL \"http://localhost:5173\") (ge (len .RedirectTo) (len $localClaimPrefix)) (eq (slice .RedirectTo 0 (len $localClaimPrefix)) $localClaimPrefix)) }}{{ $signIn := print .SiteURL \"/auth/callback\" }}{{ $signInQuery := print $signIn \"?\" }}{{ $localSignIn := \"http://127.0.0.1:5173/auth/callback\" }}{{ $localSignInQuery := print $localSignIn \"?\" }}{{ $signInCode := or (or (eq .RedirectTo $signIn) (and (ge (len .RedirectTo) (len $signInQuery)) (eq (slice .RedirectTo 0 (len $signInQuery)) $signInQuery))) (and (eq .SiteURL \"http://localhost:5173\") (or (eq .RedirectTo $localSignIn) (and (ge (len .RedirectTo) (len $localSignInQuery)) (eq (slice .RedirectTo 0 (len $localSignInQuery)) $localSignInQuery)))) }}{{ $previewPrefix := print .SiteURL \"/auth/callback/preview-ready/\" }}{{ $previewReady := and (ge (len .RedirectTo) (len $previewPrefix)) (eq (slice .RedirectTo 0 (len $previewPrefix)) $previewPrefix) }}{{ if $signInCode }}Your Venfour sign-in code{{ else if $claimCode }}Your Venfour verification code{{ else if $previewReady }}Your Venfour valuation preview is ready{{ else }}Continue your Venfour appraisal{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "{{ $claimPrefix := print .SiteURL \"/total-loss/cases/\" }}{{ $localClaimPrefix := \"http://127.0.0.1:5173/total-loss/cases/\" }}{{ $claimCode := or (and (ge (len .RedirectTo) (len $claimPrefix)) (eq (slice .RedirectTo 0 (len $claimPrefix)) $claimPrefix)) (and (eq .SiteURL \"http://localhost:5173\") (ge (len .RedirectTo) (len $localClaimPrefix)) (eq (slice .RedirectTo 0 (len $localClaimPrefix)) $localClaimPrefix)) }}{{ $signIn := print .SiteURL \"/auth/callback\" }}{{ $signInQuery := print $signIn \"?\" }}{{ $localSignIn := \"http://127.0.0.1:5173/auth/callback\" }}{{ $localSignInQuery := print $localSignIn \"?\" }}{{ $signInCode := or (or (eq .RedirectTo $signIn) (and (ge (len .RedirectTo) (len $signInQuery)) (eq (slice .RedirectTo 0 (len $signInQuery)) $signInQuery))) (and (eq .SiteURL \"http://localhost:5173\") (or (eq .RedirectTo $localSignIn) (and (ge (len .RedirectTo) (len $localSignInQuery)) (eq (slice .RedirectTo 0 (len $localSignInQuery)) $localSignInQuery)))) }}{{ $previewPrefix := print .SiteURL \"/auth/callback/preview-ready/\" }}{{ $previewReady := and (ge (len .RedirectTo) (len $previewPrefix)) (eq (slice .RedirectTo 0 (len $previewPrefix)) $previewPrefix) }}{{ if $signInCode }}Your Venfour sign-in code{{ else if $claimCode }}Your Venfour verification code{{ else if $previewReady }}Your Venfour valuation preview is ready{{ else }}Continue your Venfour appraisal{{ end }}"
content_path = "./supabase/templates/magic-link.html"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.cleanup-abandoned-anonymous-guests]
verify_jwt = false

[auth.email.template.invite]
subject = "Your invitation to Venfour"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Venfour password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your Venfour email change"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Confirm it’s you"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.notification.password_changed]
enabled = false
subject = "Your Venfour password was changed"
content_path = "./supabase/templates/password_changed_notification.html"

[auth.email.notification.email_changed]
enabled = false
subject = "Your Venfour email address was changed"
content_path = "./supabase/templates/email_changed_notification.html"

[auth.email.notification.phone_changed]
enabled = false
subject = "Your Venfour phone number was changed"
content_path = "./supabase/templates/phone_changed_notification.html"

[auth.email.notification.mfa_factor_enrolled]
enabled = false
subject = "A verification method was added"
content_path = "./supabase/templates/mfa_factor_enrolled_notification.html"

[auth.email.notification.mfa_factor_unenrolled]
enabled = false
subject = "A verification method was removed"
content_path = "./supabase/templates/mfa_factor_unenrolled_notification.html"

[auth.email.notification.identity_linked]
enabled = false
subject = "A sign-in method was linked"
content_path = "./supabase/templates/identity_linked_notification.html"

[auth.email.notification.identity_unlinked]
enabled = false
subject = "A sign-in method was removed"
content_path = "./supabase/templates/identity_unlinked_notification.html"
