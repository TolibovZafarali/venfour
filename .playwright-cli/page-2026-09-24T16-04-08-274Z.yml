      - generic [ref=e22]:
        - paragraph [ref=e23]: Total-loss valuation review
        - heading "Think your insurer’s total-loss valuation may be too low?" [level=1] [ref=e24]
        - paragraph [ref=e25]: Venfour reviews your insurer’s valuation report, vehicle details, and relevant market evidence to help you understand whether there is support for asking your insurer to reconsider the valuation.
        - generic [ref=e26]:
          - link "Review My Valuation" [ref=e27] [cursor=pointer]:
            - /url: /start?service=total-loss
          - paragraph [ref=e30]:
            - strong [ref=e31]: $199 per case
            - generic [ref=e32]: One-time payment for the full review. Check eligibility first.
        - paragraph [ref=e33]: Have your insurer’s complete valuation report ready. It is required for the paid review.
      - region [ref=e34]:
        - generic [ref=e35]:
          - paragraph [ref=e36]: A clearer view of the evidence
          - heading "Understand what supports the valuation." [level=2] [ref=e37]
        - generic [ref=e38]:
          - generic [ref=e39]:
            - heading "Your insurer’s report" [level=3] [ref=e40]
            - paragraph [ref=e41]: Vehicle specifications, comparable vehicles, condition information, and the adjustments shown in the report.
          - generic [ref=e42]:
            - heading "Your vehicle details" [level=3] [ref=e43]
            - paragraph [ref=e44]: The information you provide about mileage, equipment, and condition, together with the report’s description.
          - generic [ref=e45]:
            - heading "Relevant market evidence" [level=3] [ref=e46]
            - paragraph [ref=e47]: Comparable advertised vehicles and the differences that affect their usefulness. Asking prices are evidence, not completed sale prices.
      - region [ref=e48]:
        - generic [ref=e49]:
          - paragraph [ref=e50]: What you receive
          - heading "Findings you can understand and use." [level=2] [ref=e51]
        - generic [ref=e52]:
          - paragraph [ref=e53]: A completed valuation review and downloadable Total-Loss Valuation Report explaining the findings, supporting market evidence, and limitations.
          - paragraph [ref=e54]: When the evidence supports reconsideration, Venfour helps you prepare a request and supporting materials for your insurer. You review and send the message yourself. You can return with the insurer’s response for help understanding the next step.
          - paragraph [ref=e55]: A higher valuation, payment, or insurer acceptance is not guaranteed. Outcomes depend on the evidence and the insurer’s response.
      - region [ref=e56]:
        - paragraph [ref=e57]: The process
        - heading "Start with your report." [level=2] [ref=e58]
        - list [ref=e59]:
          - listitem [ref=e60]:
            - generic [ref=e61]: "01"
            - heading "Share your valuation details" [level=3] [ref=e62]
            - paragraph [ref=e63]: Use the existing secure intake to add your vehicle information and insurer valuation report.
          - listitem [ref=e64]:
            - generic [ref=e65]: "02"
            - heading "Confirm eligibility" [level=3] [ref=e66]
            - paragraph [ref=e67]: Venfour checks the report and available evidence. If your case is eligible, you can purchase the full review for $199.
          - listitem [ref=e68]:
            - generic [ref=e69]: "03"
            - heading "Review your findings" [level=3] [ref=e70]
            - paragraph [ref=e71]: Read the completed report and decide what to discuss with your insurer. You remain in control of your claim.
      - region [ref=e72]:
        - generic [ref=e73]:
          - paragraph [ref=e74]: Fair-Result Refund Policy
          - heading "Two separate refund protections." [level=2] [ref=e75]
        - generic [ref=e76]:
          - paragraph [ref=e77]:
            - strong [ref=e78]: "No supported dispute:"
            - text: if the completed review does not reasonably support challenging the insurer’s valuation, Venfour refunds the full purchase automatically. You keep access to your completed review and report.
          - paragraph [ref=e79]:
            - strong [ref=e80]: "Supported dispute, final increase under $1,000:"
            - text: after following the Venfour-supported reconsideration process, you may request a full refund if the final verified vehicle-value increase is below $1,000. Submit the required documentation within 30 days of the insurer’s final written response. Exactly $1,000 does not qualify.
          - paragraph [ref=e81]:
            - text: These are refund protections, not a promise of a higher payout.
            - link "Read the full refund policy and requirements." [ref=e82] [cursor=pointer]:
              - /url: /refund-policy
      - region [ref=e83]:
        - heading "Make your next step an informed one." [level=2] [ref=e84]
        - link "Review My Valuation" [ref=e85] [cursor=pointer]:
          - /url: /start?service=total-loss
        - paragraph [ref=e88]: Venfour LLC provides an independent evidence review. We are not your insurer, a law firm, or a government agency. We do not represent you or negotiate directly with your insurer. The service is not a legal opinion or a formal appraisal-clause appraisal.
