        - main [aria-hidden]:
          - article:
            - generic:
              - paragraph: Total-loss valuation review
              - heading [level=1]: Think your insurer’s total-loss valuation may be too low?
              - paragraph: Venfour reviews your insurer’s valuation report, vehicle details, and relevant market evidence to help you understand whether there is support for asking your insurer to reconsider the valuation.
              - generic:
                - link:
                  - /url: /start?service=total-loss
                  - text: Review My Valuation
                - paragraph:
                  - strong: $199 per case
                  - generic: One-time payment for the full review. Check eligibility first.
              - paragraph: Have your insurer’s complete valuation report ready. It is required for the paid review.
            - region:
              - generic:
                - paragraph: A clearer view of the evidence
                - heading [level=2]: Understand what supports the valuation.
              - generic:
                - generic:
                  - heading [level=3]: Your insurer’s report
                  - paragraph: Vehicle specifications, comparable vehicles, condition information, and the adjustments shown in the report.
                - generic:
                  - heading [level=3]: Your vehicle details
                  - paragraph: The information you provide about mileage, equipment, and condition, together with the report’s description.
                - generic:
                  - heading [level=3]: Relevant market evidence
                  - paragraph: Comparable advertised vehicles and the differences that affect their usefulness. Asking prices are evidence, not completed sale prices.
            - region:
              - generic:
                - paragraph: What you receive
                - heading [level=2]: Findings you can understand and use.
              - generic:
                - paragraph: A completed valuation review and downloadable Total-Loss Valuation Report explaining the findings, supporting market evidence, and limitations.
                - paragraph: When the evidence supports reconsideration, Venfour helps you prepare a request and supporting materials for your insurer. You review and send the message yourself. You can return with the insurer’s response for help understanding the next step.
                - paragraph: A higher valuation, payment, or insurer acceptance is not guaranteed. Outcomes depend on the evidence and the insurer’s response.
            - region:
              - paragraph: The process
              - heading [level=2]: Start with your report.
              - list:
                - listitem:
                  - generic: "01"
                  - heading [level=3]: Share your valuation details
                  - paragraph: Use the existing secure intake to add your vehicle information and insurer valuation report.
                - listitem:
                  - generic: "02"
                  - heading [level=3]: Confirm eligibility
                  - paragraph: Venfour checks the report and available evidence. If your case is eligible, you can purchase the full review for $199.
                - listitem:
                  - generic: "03"
                  - heading [level=3]: Review your findings
                  - paragraph: Read the completed report and decide what to discuss with your insurer. You remain in control of your claim.
            - region:
              - generic:
                - paragraph: Fair-Result Refund Policy
                - heading [level=2]: Two separate refund protections.
              - generic:
                - paragraph:
                  - strong: "No supported dispute:"
                  - text: if the completed review does not reasonably support challenging the insurer’s valuation, Venfour refunds the full purchase automatically. You keep access to your completed review and report.
                - paragraph:
                  - strong: "Supported dispute, final increase under $1,000:"
                  - text: after following the Venfour-supported reconsideration process, you may request a full refund if the final verified vehicle-value increase is below $1,000. Submit the required documentation within 30 days of the insurer’s final written response. Exactly $1,000 does not qualify.
                - paragraph:
                  - text: These are refund protections, not a promise of a higher payout.
                  - link:
                    - /url: /refund-policy
                    - text: Read the full refund policy and requirements.
            - region:
              - heading [level=2]: Make your next step an informed one.
              - link:
                - /url: /start?service=total-loss
                - text: Review My Valuation
              - paragraph: Venfour LLC provides an independent evidence review. We are not your insurer, a law firm, or a government agency. We do not represent you or negotiate directly with your insurer. The service is not a legal opinion or a formal appraisal-clause appraisal.
