  - main [ref=f3e18]:
    - article [ref=f3e19]:
      - generic [ref=f3e20]:
        - paragraph [ref=f3e21]: Total-loss valuation review
        - heading "Think your insurer’s total-loss valuation may be too low?" [level=1] [ref=f3e22]
        - paragraph [ref=f3e23]: Venfour reviews your insurer’s valuation report, vehicle details, and relevant market evidence to help you understand whether there is support for asking your insurer to reconsider the valuation.
        - generic [ref=f3e24]:
          - link "Review My Valuation" [ref=f3e25] [cursor=pointer]:
            - /url: https://app.venfour.com/start?service=total-loss
          - paragraph [ref=f3e28]:
            - strong [ref=f3e29]: $199 per case
            - generic [ref=f3e30]: One-time payment for the full review. Check eligibility first.
        - paragraph [ref=f3e31]: Have your insurer’s complete valuation report ready. It is required for the paid review.
      - region [ref=f3e32]:
        - generic [ref=f3e33]:
          - paragraph [ref=f3e34]: A clearer view of the evidence
          - heading "Understand what supports the valuation." [level=2] [ref=f3e35]
        - generic [ref=f3e36]:
          - generic [ref=f3e37]:
            - heading "Your insurer’s report" [level=3] [ref=f3e38]
            - paragraph [ref=f3e39]: Vehicle specifications, comparable vehicles, condition information, and the adjustments shown in the report.
          - generic [ref=f3e40]:
            - heading "Your vehicle details" [level=3] [ref=f3e41]
            - paragraph [ref=f3e42]: The information you provide about mileage, equipment, and condition, together with the report’s description.
          - generic [ref=f3e43]:
            - heading "Relevant market evidence" [level=3] [ref=f3e44]
            - paragraph [ref=f3e45]: Comparable advertised vehicles and the differences that affect their usefulness. Asking prices are evidence, not completed sale prices.
      - region [ref=f3e46]:
        - generic [ref=f3e47]:
          - paragraph [ref=f3e48]: What you receive
          - heading "Findings you can understand and use." [level=2] [ref=f3e49]
        - generic [ref=f3e50]:
          - paragraph [ref=f3e51]: A completed valuation review and downloadable Total-Loss Valuation Report explaining the findings, supporting market evidence, and limitations.
          - paragraph [ref=f3e52]: When the evidence supports reconsideration, Venfour helps you prepare a request and supporting materials for your insurer. You review and send the message yourself. You can return with the insurer’s response for help understanding the next step.
          - paragraph [ref=f3e53]: A higher valuation, payment, or insurer acceptance is not guaranteed. Outcomes depend on the evidence and the insurer’s response.
      - region [ref=f3e54]:
        - paragraph [ref=f3e55]: The process
        - heading "Start with your report." [level=2] [ref=f3e56]
        - list [ref=f3e57]:
          - listitem [ref=f3e58]:
            - generic [ref=f3e59]: "01"
            - heading "Share your valuation details" [level=3] [ref=f3e60]
            - paragraph [ref=f3e61]: Use the existing secure intake to add your vehicle information and insurer valuation report.
          - listitem [ref=f3e62]:
            - generic [ref=f3e63]: "02"
            - heading "Confirm eligibility" [level=3] [ref=f3e64]
            - paragraph [ref=f3e65]: Venfour checks the report and available evidence. If your case is eligible, you can purchase the full review for $199.
          - listitem [ref=f3e66]:
            - generic [ref=f3e67]: "03"
            - heading "Review your findings" [level=3] [ref=f3e68]
            - paragraph [ref=f3e69]: Read the completed report and decide what to discuss with your insurer. You remain in control of your claim.
      - region [ref=f3e70]:
        - generic [ref=f3e71]:
          - paragraph [ref=f3e72]: Fair-Result Refund Policy
          - heading "Two separate refund protections." [level=2] [ref=f3e73]
        - generic [ref=f3e74]:
          - paragraph [ref=f3e75]:
            - strong [ref=f3e76]: "No supported dispute:"
            - text: if the completed review does not reasonably support challenging the insurer’s valuation, Venfour refunds the full purchase automatically. You keep access to your completed review and report.
          - paragraph [ref=f3e77]:
            - strong [ref=f3e78]: "Supported dispute, final increase under $1,000:"
            - text: after following the Venfour-supported reconsideration process, you may request a full refund if the final verified vehicle-value increase is below $1,000. Submit the required documentation within 30 days of the insurer’s final written response. Exactly $1,000 does not qualify.
          - paragraph [ref=f3e79]:
            - text: These are refund protections, not a promise of a higher payout.
            - link "Read the full refund policy and requirements." [ref=f3e80] [cursor=pointer]:
              - /url: /refund-policy
      - region [ref=f3e81]:
        - heading "Make your next step an informed one." [level=2] [ref=f3e82]
        - link "Review My Valuation" [ref=f3e83] [cursor=pointer]:
          - /url: https://app.venfour.com/start?service=total-loss
        - paragraph [ref=f3e86]: Venfour LLC provides an independent evidence review. We are not your insurer, a law firm, or a government agency. We do not represent you or negotiate directly with your insurer. The service is not a legal opinion or a formal appraisal-clause appraisal.
